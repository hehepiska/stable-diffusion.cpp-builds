name: build-sdcpp-cpu-custom
on:
  schedule:
    - cron: '0 4,16 * * *'   # дважды в сутки
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: master
          submodules: recursive   # обязательно для подтягивания ggml

      - name: Build sd-cli in Ubuntu 20.04 container (glibc 2.31)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              set -ex
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ca-certificates

              cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSD_BUILD_EXAMPLES=ON \
                -DSD_BUILD_SERVER=OFF \
                -DSD_CUDA=OFF \
                -DSD_VULKAN=OFF \
                -DSD_HIPBLAS=OFF \
                -DSD_METAL=OFF \
                -DSD_BUILD_SHARED_LIBS=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

              # Собираем только цель sd-cli
              cmake --build build --config Release --target sd-cli -j$(nproc)

              # Очищаем бинарник от отладочных символов для уменьшения размера
              strip build/bin/sd-cli
            '

      - name: Smoke test
        run: |
          # Проверяем запуск прямо на хосте (обратная совместимость glibc)
          ./build/bin/sd-cli --help

      - name: Package
        run: |
          # Упаковываем строго один бинарник
          tar -czvf sd-cli-linux-x86_64-cpu.tar.gz -C build/bin sd-cli

      - name: Upload artifact (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: sd-cli-linux-x86_64-cpu
          path: sd-cli-linux-x86_64-cpu.tar.gz
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-sd-${{ github.run_number }}
          files: sd-cli-linux-x86_64-cpu.tar.gz
