name: build-sdcpp-cpu-custom
on:
  schedule:
    - cron: '0 4,16 * * *'   # дважды в сутки
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: master
          submodules: recursive

      - name: Build sd-cli in manylinux container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
              set -ex

              cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSD_BUILD_EXAMPLES=ON \
                -DSD_BUILD_SERVER=OFF \
                -DSD_WEBP=OFF \
                -DSD_WEBM=OFF \
                -DSD_CUDA=OFF \
                -DSD_VULKAN=OFF \
                -DSD_HIPBLAS=OFF \
                -DSD_METAL=OFF \
                -DSD_BUILD_SHARED_LIBS=OFF \
                -DGGML_NATIVE=OFF \
                -DGGML_AVX512=OFF \
                -DGGML_AVX2=ON \
                -DGGML_AVX=ON \
                -DGGML_FMA=ON \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

              cmake --build build --config Release --target sd-cli -j$(nproc)

              strip build/bin/sd-cli
              chmod 755 build/bin/sd-cli
            '

      - name: Smoke test
        run: |
          # Проверяем запуск бинарника
          ./build/bin/sd-cli --help

      - name: Package
        run: |
          tar -czvf sd-cli-linux-x86_64-cpu.tar.gz -C build/bin sd-cli

      - name: Upload artifact (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: sd-cli-linux-x86_64-cpu
          path: sd-cli-linux-x86_64-cpu.tar.gz
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-sd-${{ github.run_number }}
          files: sd-cli-linux-x86_64-cpu.tar.gz
