name: Build stable-diffusion.cpp with CUDA

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.2-devel-ubuntu22.04

    strategy:
      matrix:
        arch:
          - name: "turing"
            sm: "75-virtual"
          - name: "ampere"
            sm: "80-virtual;86-virtual"
          - name: "ada"
            sm: "89-virtual"
          - name: "blackwell"
            sm: "120-virtual"

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            build-essential \
            curl \
            ccache \
            libgl-dev \
            libglx-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            libgomp1 \
            zip

      - name: Install Node.js and pnpm
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm

      - name: Clone stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: 'leejet/stable-diffusion.cpp'
          submodules: 'recursive'
          path: 'stable-diffusion.cpp'

      - name: Configure and Build
        run: |
          cd stable-diffusion.cpp
          mkdir build && cd build
          cmake .. \
            -DSD_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.arch.sm }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel $(nproc)

      # Явно смотрим что собралось — чтобы знать реальные пути
      - name: List build output
        run: |
          echo "=== bin/ ==="
          ls -lh stable-diffusion.cpp/build/bin/ || echo "bin/ not found"
          echo "=== *.so ==="
          find stable-diffusion.cpp/build/ -name "*.so" || echo "no .so files"

      # Пакуем только bin/ — гарантированно существует после успешной сборки
      # Все пути относительно GITHUB_WORKSPACE
      - name: Package artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          zip -r \
            $GITHUB_WORKSPACE/dist/sd-cuda-${{ matrix.arch.name }}.zip \
            stable-diffusion.cpp/build/bin/
          echo "=== Packed ==="
          ls -lh $GITHUB_WORKSPACE/dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd-cuda-${{ matrix.arch.name }}
          path: ${{ github.workspace }}/dist/sd-cuda-${{ matrix.arch.name }}.zip
          if-no-files-found: error  # error вместо warn — сразу видно проблему

  release:
    needs: build-cuda
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: false

      - name: Display downloaded files
        run: find dist/ -type f -ls

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "CUDA Build ${{ steps.sha.outputs.short }}"
          body: |
            ## stable-diffusion.cpp CUDA build

            Commit: ${{ github.sha }}

            ### Выбери нужный архив по своей видеокарте:

            | Файл | Архитектура | GPU |
            |------|-------------|-----|
            | `sd-cuda-turing.zip` | sm_75 | RTX 20xx, GTX 16xx |
            | `sd-cuda-ampere.zip` | sm_80, sm_86 | RTX 30xx, A100 |
            | `sd-cuda-ada.zip` | sm_89 | RTX 40xx |
            | `sd-cuda-blackwell.zip` | sm_120 | RTX 50xx |

            > Сборка с PTX (virtual) — JIT компиляция при первом запуске.
            > Требуется драйвер с поддержкой CUDA 12.8+
          files: dist/**/*.zip
          draft: false
          prerelease: false
