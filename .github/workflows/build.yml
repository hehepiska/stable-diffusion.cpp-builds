name: Build stable-diffusion.cpp with CUDA

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную через интерфейс GitHub

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    # Используем официальный контейнер разработки NVIDIA CUDA
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04

    steps:
      # В минимальном контейнере NVIDIA отсутствуют некоторые утилиты, установим их
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git cmake build-essential curl

      # Установка Node.js и pnpm (как в вашем исходном скрипте)
      - name: Install Node.js and pnpm
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm

      # Клонирование репозитория stable-diffusion.cpp со всеми подмодулями
      - name: Clone stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: 'leejet/stable-diffusion.cpp'
          submodules: 'recursive'
          path: 'stable-diffusion.cpp'

      # Сборка проекта с флагом -DSD_CUDA=ON
      - name: Configure and Build
        run: |
          cd stable-diffusion.cpp
          mkdir build && cd build
          cmake .. -DSD_CUDA=ON
          cmake --build . --config Release
          ls -la

      # Опционально: сохранение собранных бинарных файлов как артефактов сборки
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-diffusion-cuda-binaries
          path: |
            stable-diffusion-cpp/build/bin/
            stable-diffusion-cpp/build/*.bin
          if-no-files-found: warn
